appId: no.solside.oversettelse
productName: Solside
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
win:
  target: nsis
  icon: public/solside-icon.png
  artifactName: Solside-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  installerLanguages: [en_US]
  language: 1033
  installerHeader: build/wizard-header.bmp
  installerSidebar: build/wizard.bmp
  uninstallerSidebar: build/wizard.bmp
  perMachine: false
  selectPerMachineByDefault: false
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: false
  createDesktopShortcut: false
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
publish: null
